# Local/loopback development compose. Production placement (reverse proxy,
# TLS, DNS) is described in docs/DEPLOYMENT.md.
services:
  trilium-mcp:
    build: .
    image: trilium-mcp:local
    restart: unless-stopped
    env_file: .env
    environment:
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: "3939"
    ports:
      - "127.0.0.1:3939:3939"
